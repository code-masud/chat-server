<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Chat Room</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-header {
            background: #4a76a8;
            color: white;
            padding: 15px;
            font-size: 18px;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .message {
            max-width: 60%;
            margin-bottom: 10px;
            padding: 10px 15px;
            border-radius: 15px;
            position: relative;
            word-wrap: break-word;
        }

        .message .username {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .message.other {
            background: white;
            align-self: flex-start;
        }

        .message.me {
            background: #dcf8c6;
            align-self: flex-end;
        }

        .chat-input {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ccc;
            outline: none;
        }

        .chat-input button {
            margin-left: 10px;
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            background: #4a76a8;
            color: white;
            cursor: pointer;
        }

        .chat-input button:hover {
            background: #3b5f87;
        }
    </style>
</head>
<body>

<div class="chat-header">
    Room: {{ room_name }}
</div>

<div id="chat-container" class="chat-container"></div>

<div class="chat-input">
    <input id="chat-message-input" type="text" placeholder="Type a message...">
    <button id="chat-message-submit">Send</button>
</div>

{{ room_name|json_script:"room-name" }}
{{ request.user.username|json_script:"current-user" }}

<script>
    const roomName = JSON.parse(document.getElementById('room-name').textContent);
    const currentUser = JSON.parse(document.getElementById('current-user').textContent);

    const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";

    const chatSocket = new WebSocket(
        wsProtocol + window.location.host + '/ws/chat/' + roomName + '/'
    );

    const chatContainer = document.getElementById("chat-container");

    chatSocket.onmessage = function(e) {
        const data = JSON.parse(e.data);

        if (data.history) {
            data.history.forEach(msg => addMessage(msg.username, msg.message));
        } else {
            addMessage(data.username, data.message);
        }
    };

    function addMessage(username, message) {
        const messageDiv = document.createElement("div");
        const isMe = username === currentUser;

        messageDiv.classList.add("message");
        messageDiv.classList.add(isMe ? "me" : "other");

        messageDiv.innerHTML = `
            <div class="username">${username}</div>
            <div>${message}</div>
        `;

        chatContainer.appendChild(messageDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    chatSocket.onclose = function(e) {
        console.error('Chat socket closed unexpectedly');
    };

    const input = document.getElementById("chat-message-input");
    const button = document.getElementById("chat-message-submit");

    input.focus();

    input.addEventListener("keyup", function(e) {
        if (e.key === "Enter") {
            button.click();
        }
    });

    button.onclick = function() {
        const message = input.value.trim();
        if (!message) return;

        chatSocket.send(JSON.stringify({
            "message": message
        }));

        input.value = "";
    };
</script>

</body>
</html>
